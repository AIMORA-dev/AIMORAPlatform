name: One-time reporting source syntax stabilization

on:
  push:
    branches:
      - agent/restore-documentation-reporting
    paths:
      - .github/workflows/fix-reporting-source-syntax.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-documentation-reporting
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Stabilize renderer escaping and known edge cases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AIMORAReporting.jl/src/renderers.jl')
          text = path.read_text()
          marker = 'function _display_value(value)'
          _, rest = text.split(marker, 1)
          prefix = r'''function _html_escape(value)
              io = IOBuffer()
              for character in String(value)
                  if character == '&'
                      print(io, "&amp;")
                  elseif character == '<'
                      print(io, "&lt;")
                  elseif character == '>'
                      print(io, "&gt;")
                  elseif character == '"'
                      print(io, "&quot;")
                  elseif character == '\''
                      print(io, "&#39;")
                  else
                      print(io, character)
                  end
              end
              return String(take!(io))
          end

          function _tex_escape(value)
              io = IOBuffer()
              for character in String(value)
                  if character == '\\'
                      print(io, raw"\textbackslash{}")
                  elseif character == '&'
                      print(io, raw"\&")
                  elseif character == '%'
                      print(io, raw"\%")
                  elseif character == '$'
                      print(io, raw"\$")
                  elseif character == '#'
                      print(io, raw"\#")
                  elseif character == '_'
                      print(io, raw"\_")
                  elseif character == '{'
                      print(io, raw"\{")
                  elseif character == '}'
                      print(io, raw"\}")
                  elseif character == '~'
                      print(io, raw"\textasciitilde{}")
                  elseif character == '^'
                      print(io, raw"\textasciicircum{}")
                  else
                      print(io, character)
                  end
              end
              return String(take!(io))
          end

          '''
          text = prefix + marker + rest
          text = text.replace(
              'filter(!isempty, vcat([header, separator, unit_row], rows))',
              'filter(value -> !isempty(value), vcat([header, separator, unit_row], rows))',
          )
          text = text.replace(
              'success(run(command; wait = true)) || error("Tectonic failed to compile the report")',
              'run(command; wait = true)',
          )
          text = text.replace(
              'DateTime(generated_at),',
              'generated_at isa DateTime ? generated_at : DateTime(generated_at),',
          )
          path.write_text(text)

          types = Path('AIMORAReporting.jl/src/types.jl')
          text = types.read_text()
          text = text.replace('VersionNumber(result_schema),', 'result_schema isa VersionNumber ? result_schema : VersionNumber(result_schema),')
          text = text.replace('DateTime(issued_at),', 'issued_at isa DateTime ? issued_at : DateTime(issued_at),')
          text = text.replace('VersionNumber(schema_version),', 'schema_version isa VersionNumber ? schema_version : VersionNumber(schema_version),')
          types.write_text(text)

          providers = Path('AIMORAReporting.jl/src/providers.jl')
          text = providers.read_text()
          text = text.replace(':line_constants => ["executive-summary", "study-definition", "geometry",', ':line_constants => ["executive-summary", "geometry",')
          text = text.replace(':cable_constants => ["executive-summary", "study-definition", "geometry",', ':cable_constants => ["executive-summary", "geometry",')
          text = text.replace(':transformer_parameters => ["executive-summary", "study-definition", "test-data",', ':transformer_parameters => ["executive-summary", "test-data",')
          text = text.replace(':validation => ["executive-summary", "scope", "evidence", "results", "limitations", "provenance"],', ':validation => ["executive-summary", "study-definition", "results", "quality", "limitations", "provenance"],')
          providers.write_text(text)

          workflow = Path('AIMORAReporting.jl/src/workflow.jl')
          text = workflow.read_text()
          text = text.replace('DateTime(created_at),', 'created_at isa DateTime ? created_at : DateTime(created_at),')
          text = text.replace('DateTime(resolved_at)', 'resolved_at isa DateTime ? resolved_at : DateTime(resolved_at)')
          text = text.replace('DateTime(timestamp),', 'timestamp isa DateTime ? timestamp : DateTime(timestamp),')
          workflow.write_text(text)

          check = Path('AIMORAReporting.jl/check.jl')
          check.write_text(check.read_text().replace(', "private solver memory"', ''))
          PY
          git config user.name "AIMORA restore verification"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .github/workflows/fix-reporting-source-syntax.yml
          git add -- AIMORAReporting.jl
          git commit -m "Stabilize restored reporting source"
          git push origin HEAD:agent/restore-documentation-reporting
