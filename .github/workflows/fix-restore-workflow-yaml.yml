name: One-time quote fix for restored reporting workflow

on:
  push:
    branches:
      - agent/restore-documentation-reporting
    paths:
      - .github/workflows/fix-restore-workflow-yaml.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-documentation-reporting
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Quote negative path and remove this fixer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/restore-reporting-verification.yml')
          text = path.read_text().replace(
              '      - !AIMORAReporting.jl/RESTORE_VERIFICATION.md',
              "      - '!AIMORAReporting.jl/RESTORE_VERIFICATION.md'",
          )
          path.write_text(text)
          PY
          git config user.name "AIMORA restore verification"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .github/workflows/fix-restore-workflow-yaml.yml
          git add -- .github/workflows/restore-reporting-verification.yml
          git commit -m "Fix reporting verification workflow path syntax"
          git push origin HEAD:agent/restore-documentation-reporting
