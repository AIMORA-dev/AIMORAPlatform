name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Repository integration contract
        run: julia --startup-file=no test/runtests.jl

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - AIMORAProject.jl
          - AIMORAFormats.jl
          - AIMORALayout.jl
          - AIMORAService.jl
          - AIMORAVisuals.jl
          - AIMORAReporting.jl
          - AIMORASymbols.jl
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Julia package tests
        if: matrix.package != 'AIMORASymbols.jl'
        run: julia --startup-file=no --project="${{ matrix.package }}" -e 'using Pkg; Pkg.test()'
      - name: Symbol library tests
        if: matrix.package == 'AIMORASymbols.jl'
        run: julia --startup-file=no "${{ matrix.package }}/tests/runtests.jl"
