name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Repository integration contract
        run: julia --startup-file=no test/runtests.jl

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - AIMORAProject
          - AIMORAFormats
          - AIMORALayout
          - AIMORAService
          - AIMORAVisuals
          - AIMORAReporting
          - AIMORASymbols
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Prepare sibling package dependencies
        if: matrix.package == 'AIMORAProject'
        run: julia --startup-file=no --project="${{ matrix.package }}" -e 'using Pkg; Pkg.develop(path="AIMORAFormats")'
      - name: Julia package tests
        if: matrix.package != 'AIMORASymbols'
        run: julia --startup-file=no --project="${{ matrix.package }}" -e 'using Pkg; Pkg.test()'
      - name: Symbol library tests
        if: matrix.package == 'AIMORASymbols'
        run: julia --startup-file=no "${{ matrix.package }}/tests/runtests.jl"

  cross-platform:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        julia: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Repository and package qualification
        shell: bash
        run: |
          julia --startup-file=no test/runtests.jl
          julia --startup-file=no --project=AIMORAFormats -e 'using Pkg; Pkg.test()'
          julia --startup-file=no --project=AIMORAProject -e 'using Pkg; Pkg.develop(path="AIMORAFormats"); Pkg.test()'
          julia --startup-file=no --project=AIMORALayout -e 'using Pkg; Pkg.test()'
          julia --startup-file=no --project=AIMORAService -e 'using Pkg; Pkg.test()'
          julia --startup-file=no --project=AIMORAVisuals -e 'using Pkg; Pkg.test()'
          julia --startup-file=no --project=AIMORAReporting -e 'using Pkg; Pkg.test()'
          julia --startup-file=no AIMORASymbols/tests/runtests.jl
